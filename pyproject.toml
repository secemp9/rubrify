[project]
name = "rubrify"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "harn-ai",
    "harn-agent",
    "pydantic>=2.10",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
evolve = ["gepa>=0.1.0"]
dev = ["python-dotenv>=1.0"]

[tool.uv.sources]
harn-ai = { workspace = true }
harn-agent = { workspace = true }
gepa = { path = "../../../gepa", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rubrify"]
